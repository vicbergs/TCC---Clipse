<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#140A24">
<title>Protótipo do site Clipse</title>
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<a class="pular" href="#conteudo" data-acao="pular">Pular para o conteúdo</a>

<header class="topo">
  <div class="topo-in">
    <a class="marca" id="marca" href="#inicio" aria-label="Clipse, página inicial">Clipse</a>
    <nav class="nav-topo" id="nav-topo" aria-label="Seções"></nav>
    <div class="conta" id="conta"></div>
    <div class="popover" id="popover" hidden></div>
  </div>
</header>

<main id="conteudo" tabindex="-1">
  <noscript><p style="padding:24px">Este protótipo precisa de JavaScript para funcionar.</p></noscript>
</main>

<footer class="rodape" id="rodape"></footer>

<nav class="tabbar" id="tabbar" aria-label="Principal"></nav>

<div class="veu" id="veu" hidden></div>
<section class="folha" id="folha" role="dialog" aria-modal="true" aria-labelledby="folha-titulo" tabindex="-1" hidden>
  <div class="folha-cabeca" id="folha-cabeca">
    <h2 id="folha-titulo"></h2>
    <button type="button" class="btn-x" data-acao="fechar-folha" aria-label="Fechar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="folha-corpo" id="folha-corpo"></div>
</section>

<div class="aviso" id="aviso" role="status" aria-live="polite"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
